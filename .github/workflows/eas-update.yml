name: EAS Update (OTA)

# Publishes the JS bundle to EAS Update on every push to main, so the
# installed Livo APK picks up code/design/text fixes automatically
# (no new APK). Android only — there is no iOS build yet.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'App.js'
      - 'app.json'
      - 'assets/**'
      - 'package.json'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # --legacy-peer-deps: react-native-svga-player@1.1.0 wants
      # react ^16.8.1 but the app uses react 18.3.1 (it was
      # installed locally with --legacy-peer-deps too). Plain
      # `npm ci` fails with ERESOLVE on that peer conflict.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Write env (public token-server URL, also in .env.example)
        run: echo "EXPO_PUBLIC_AGORA_TOKEN_SERVER_URL=https://livo-token-server.onrender.com" > .env
      - name: Publish OTA update
        run: npx --yes eas-cli update --branch production --platform android --message "OTA auto $GITHUB_SHA" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
